apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: sw2p2-gateway-cluster
  region: us-east-1
  version: "1.31"

iam:
  withOIDC: true

vpc:
  cidr: 10.0.0.0/16
  nat:
    gateway: Single

availabilityZones:
  - us-east-1a
  - us-east-1b

managedNodeGroups:
  - name: gateway-nodes
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    volumeType: gp3
    privateNetworking: false
    labels:
      role: gateway
      environment: production
    tags:
      Name: sw2p2-gateway-node
      Project: sw2p2
      ManagedBy: eksctl
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        ebs: true
        efs: true
        albIngress: true
        cloudWatch: true

addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: aws-ebs-csi-driver
    version: latest
